name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No secrets needed: tests/conftest.py deliberately disables
      # Settings' .env loading for the whole test session, so the suite
      # only ever sees configuration a test explicitly sets — never
      # whatever happens to be in a developer's local apps/api/.env.
      - name: Run pytest
        run: python -m pytest -q

  backend-tests-postgres:
    name: Backend tests (pytest, real Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # Runs the exact same test suite as backend-tests above, but against
    # a real Postgres instead of the default in-memory SQLite — see
    # docs/CHECKLIST.md's "Post-Phase-7: verify the test suite against
    # real Postgres" section. SQLite and Postgres genuinely differ (e.g.
    # datetime timezone round-tripping), and production targets
    # Postgres, so this is the gate that actually proves it. Matches
    # infra/docker-compose.yml's postgres:16-alpine.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datalume
          POSTGRES_PASSWORD: datalume
          POSTGRES_DB: datalume_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datalume"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest against real Postgres
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+asyncpg://datalume:datalume@localhost:5432/datalume_test
        run: python -m pytest -q

  frontend-build:
    name: Frontend typecheck + build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
